<title>Tänk! テンク</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 配置の考え方: 霧の森の石机に、組み紐で縁取った正五角形の古地図を広げた画面。左（スマホでは上）に地図、右に商会の帳場。 */
:root{
  --sea:#14231d; --sea2:#1f352b; --sea3:#2d4a3c; --line:#55796a;
  --brass:#dcb860; --brass2:#a98838; --paper:#f1e9d4; --mute:#b9c7b4;
  --warn:#ffb46b; --dark:#0d1813;
  --wood:#5f9a58; --stone:#a7a49a; --iron:#6f93b8; --coal:#4b4650; --cotton:#ece4d2; --food:#dcb648; --copper:#b5653a; --salt:#b9d6e0; --waste:#7a6248;
  --p0:#ff7a5c; --p1:#ffd34d; --p2:#6fd0ff; --p3:#e39bff;
  --disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sea);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.6}
#app{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{background:var(--sea2);border:1px solid var(--line);border-radius:6px;padding:9px 13px;min-height:42px;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn.main{background:var(--brass);border-color:var(--brass);color:#22200f}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
.btn small{display:block;font-weight:500;font-size:11.5px;color:inherit;opacity:.85;line-height:1.3}
input,select{font:inherit;color:var(--paper);background:var(--sea);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:42px;width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.sub{color:var(--mute);font-size:13px}
.err{color:var(--warn);font-size:13px}
.title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center;padding-top:12px}
.title h1{font-size:clamp(36px,6.4vw,62px);line-height:1.15;color:var(--brass)}
.title .lead{margin-top:10px;max-width:30em}
.title svg{width:100%;height:auto;display:block}
.stack{display:grid;gap:12px;margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.row>*{min-width:0}
.grow{flex:1 1 130px}
.sheet{border-top:1px solid var(--line);padding-top:14px;margin-top:18px;display:grid;gap:10px}
.tables{display:grid;gap:6px}
.trow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--sea3)}
.code{font-family:var(--disp);font-size:34px;letter-spacing:.14em;color:var(--brass)}
.game{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,1fr);gap:20px;align-items:start}
.boardwrap{position:sticky;top:env(safe-area-inset-top,0px)}
.board{width:100%;height:auto;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none;max-height:calc(100vh - 28px)}
.side{display:grid;gap:14px;min-width:0}
.prompt{border-left:4px solid var(--who,var(--brass));padding:6px 0 6px 12px}
.prompt b{font-family:var(--disp);font-size:18px}
.purse{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.purse b{font-family:var(--disp);font-size:26px;color:var(--brass);font-variant-numeric:tabular-nums}
.hand{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.res{border-radius:6px;padding:5px 1px 4px;text-align:center;color:#17222a;font-weight:700;line-height:1.2}
.res b{display:block;font-size:20px;font-family:var(--disp)}
.res span{font-size:11.5px}
.r-wood{background:var(--wood)}.r-stone{background:var(--stone)}.r-iron{background:var(--iron)}.r-coal{background:var(--coal);color:#fff}.r-cotton{background:var(--cotton)}.r-food{background:var(--food)}.r-copper{background:var(--copper);color:#fff}.r-salt{background:var(--salt)}
.dice{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.dice b{min-width:52px;height:42px;padding:0 6px;display:grid;place-items:center;border-radius:6px;background:var(--paper);color:#17222a;font-family:var(--disp);font-size:18px}.town{display:grid;gap:6px;padding-top:8px;border-top:1px solid var(--sea3)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.acts .wide{grid-column:1/-1}
.cardrow{display:flex;flex-wrap:wrap;gap:6px}
.players{display:grid;gap:2px}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 6px;border-radius:4px}
.pl.cur{background:var(--sea2)}
.pl i{width:12px;height:12px;border-radius:50%;display:block}
.pl .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.vp{font-family:var(--disp);font-size:20px;color:var(--brass);font-variant-numeric:tabular-nums}
.box{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.box h3{font-size:15px;color:var(--brass)}
.mk{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center}
.mk .btn{padding:4px 6px;min-height:36px;font-size:13px}
.step{display:grid;grid-template-columns:48px repeat(2,minmax(0,1fr));gap:6px;align-items:center}
.pm{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;text-align:center;font-variant-numeric:tabular-nums}
.pm button{background:var(--sea2);border:1px solid var(--line);border-radius:5px;min-height:34px;padding:0}
.log{max-height:190px;overflow:auto;font-size:13px;display:grid;gap:2px;color:var(--mute)}
.log p:first-child{color:var(--paper)}
.offer{border:1px solid var(--brass);border-radius:6px;padding:9px 11px;display:grid;gap:7px}
.rules{max-width:46em;display:grid;gap:12px}
.rules h2{color:var(--brass);font-size:24px}
.rules h3{color:var(--brass);font-size:17px;margin-top:6px}
.rules ul{margin:0;padding-left:1.2em;display:grid;gap:3px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl td,.tbl th{border-bottom:1px solid var(--sea3);padding:5px 8px;text-align:left}
.over{position:fixed;inset:0;background:rgba(7,14,11,.86);display:grid;place-items:center;z-index:20;padding:16px}
.over>div{background:var(--sea2);border:1px solid var(--brass);border-radius:8px;padding:20px;max-width:420px;width:100%;display:grid;gap:10px}
.over h2{color:var(--brass);font-size:26px}
.track{position:relative;height:44px;background:var(--sea);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--wood)}
.mark{position:absolute;top:0;bottom:0;width:5px;margin-left:-2px;background:var(--brass)}
.big{font-family:var(--disp);font-size:56px;text-align:center;color:var(--brass);line-height:1.1}
.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@keyframes tumble{0%,50%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(10deg)}75%{transform:translateY(-4px) rotate(-10deg)}}
.dice.rolling b{animation:tumble .32s linear infinite}.dice.rolling b:nth-child(2){animation-delay:-.08s}.dice.rolling b:nth-child(3){animation-delay:-.16s}.dice.rolling b:nth-child(4){animation-delay:-.24s}.dice.rolling b:nth-child(5){animation-delay:-.04s}
@media (prefers-reduced-motion:reduce){.pulse,.dice.rolling b{animation:none}}
@media (max-width:820px){
  .title{grid-template-columns:minmax(0,1fr)}
  .title svg{max-width:280px;margin:0 auto;order:-1}
  .game{grid-template-columns:minmax(0,1fr)}
  .boardwrap{position:static}
  .board{max-height:none}
}

.rules h2::after{content:"";display:block;height:24px;margin-top:6px;background:var(--knot) repeat-x left center}

<script id="engine">
'use strict';
/* ===== ゲームの中身（画面に依存しない） ===== */
const RES=['wood','stone','iron','coal','cotton','food','copper','salt'],KEYS=[...RES,'money'];

      if(miss.some(r=>o.give[r])&&KEYS.every(r=>!o.want[r]||p.hand[r]-o.want[r]>=(goal[r]||0))&&val(o.give)>=val(o.want))return{t:'accept',s:i}}}

<script id="ui">
'use strict';
/* ===== 画面とオンライン ===== */
const PC=['var(--p0)','var(--p1)','var(--p2)','var(--p3)'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
/* 盤面のマスの柄（細かい明暗を避けた、落ち着いた図柄） */
const TPAT=(()=>{const at=(xs,g)=>xs.map(([x,y])=>`<g transform="translate(${x},${y})">${g}</g>`).join(''),P=[[15,16],[45,46]],P3=[[12,14],[44,24],[24,48]];
return{
wood:at(P,'<path d="M0-11L8 4H-8Z" fill="#000" fill-opacity=".2"/><rect x="-1.6" y="4" width="3.2" height="5" fill="#000" fill-opacity=".2"/>'),
stone:at(P3,'<path d="M-9 3Q-10-5-2-6Q8-7 9 1Q9 6 0 6Q-8 7-9 3Z" fill="#fff" fill-opacity=".14" stroke="#000" stroke-opacity=".14" stroke-width="2"/>'),
iron:at(P,'<path d="M-10 5H10L7-4H-7Z" fill="#000" fill-opacity=".17"/><path d="M-6-1H6" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>'),
coal:at(P3,'<path d="M-7-2L-2-7L6-5L8 2L2 7L-6 5Z" fill="#fff" fill-opacity=".09"/>'),
cotton:at(P,'<circle cx="-5" cy="1" r="5" fill="#8a7a58" fill-opacity=".18"/><circle cx="4" cy="2" r="5" fill="#8a7a58" fill-opacity=".18"/><circle cx="0" cy="-4" r="5" fill="#8a7a58" fill-opacity=".18"/><path d="M0 6V11" stroke="#7a6a4a" stroke-opacity=".35" stroke-width="2"/>'),
food:at(P,'<path d="M0 11V-9" stroke="#5a3f10" stroke-opacity=".25" stroke-width="2"/>'+[-6,-1,4].map(y=>`<ellipse cx="-3" cy="${y}" rx="3" ry="2" transform="rotate(-30 -3 ${y})" fill="#5a3f10" fill-opacity=".22"/><ellipse cx="3" cy="${y}" rx="3" ry="2" transform="rotate(30 3 ${y})" fill="#5a3f10" fill-opacity=".22"/>`).join('')),
copper:at(P,'<circle r="8" fill="#fff" fill-opacity=".2"/><rect x="-2.5" y="-2.5" width="5" height="5" fill="#000" fill-opacity=".18"/>'),
salt:at(P3,'<path d="M0-6L6 0L0 6L-6 0Z" fill="#fff" fill-opacity=".4"/>')}})();
/* 絵は最初に1回だけ読み込み、再描画では名前で参照する */
(function(){const k=Object.keys(ART);if(!k.length)return;const d=document.createElement('div');d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
  d.innerHTML=`<svg width="0" height="0" aria-hidden="true"><defs>${k.map(n=>`<pattern id="t-${n}" patternUnits="userSpaceOnUse" width="60" height="60"><rect width="60" height="60" style="fill:var(--${n},#555)"/>${TPAT[n]||''}</pattern>`).join('')}</defs></svg>`;document.body.prepend(d);
  const s=document.createElement('style');s.textContent=k.map(n=>`.a-${n}{background-image:linear-gradient(rgba(0,0,0,0) 35%,rgba(0,0,0,.72)),url(${ART[n]});background-size:cover;background-position:center}`).join('');document.body.appendChild(s)})();
const artC=k=>ART[k]?` a-${k}`:'';
let G=null;
const UI={screen:'title',lv:Math.min(4,Math.max(0,+(ls.get('goka.lv')??1)||0)),name:ls.get('goka.name')||'',code:'',msg:'',size:4,map:1,target:20,mode:null,panel:null,give:{},want:{},card:null,r1:'wood',r2:'iron',toast:''};
const NET={db:null,room:null,uid:null,pid:null,ready:false,tid:null,t:null,gr:null,unsub:null,peers:[],seen:{},writing:false,pendingW:false,open:[],stats:{},aid:0,local:false,wait:null,nextCpu:0,act:{},mark:0,pinged:0};
const SRV=!!(window.claude&&window.claude.server);
const seatOf=()=>{if(NET.local){if(!G)return null;const i=G.pl.findIndex(p=>p.me);return i<0?null:i}if(!G||!NET.pid)return null;const i=G.pl.findIndex(p=>p.uid===NET.pid);return i<0?null:i};

/* --- 通信 --- */
async function boot(hot){
  if(hot&&hot.G){G=hot.G;NET.local=true;UI.screen='game'}
  render();setInterval(tick,300);
  if(typeof window.claude?.use!=='function'){NET.ready=true;render();return}
  const[db,room,user]=await Promise.all(['db','room','user'].map(n=>window.claude.use(n).catch(()=>null)));
  NET.db=db;NET.room=room;NET.ready=true;
  if(db&&room&&user){
    NET.uid=await user.id();
    const m=/^#t-([a-z0-9]{5})(?:-(p\d))?$/.exec(location.hash||'');
    NET.pid=NET.uid+(!SRV&&m&&m[2]?'~'+m[2]:'');
    db.collection('stats').onSnapshot(s=>{s.docs.forEach(d=>{const x=d.data();if(x&&x.n)NET.stats[x.n]=x});soft()},()=>{});
    db.collection('tables').where('status','==','wait').limit(30).onSnapshot(s=>{const cut=Date.now()-6*3600e3;NET.open=s.docs.map(d=>d.data()).filter(t=>t&&t.created>cut);soft()},()=>{});
    const code=m?m[1]:ls.get('goka.table');
    if(code&&!G)resume(code,!!m)}
  render()}
async function resume(code,fromLink){
  try{const s=await NET.db.doc('tables/'+code).get();
    if(!s.exists){ls.del('goka.table');if(fromLink){UI.msg='その部屋は見つかりませんでした';render()}return}
    const t=s.data();
    if(t.seats.some(x=>x.uid===NET.pid)&&t.status!=='done')return enter(code);
    if(fromLink){UI.code=code;if(UI.name)join(code);else{UI.msg='名前を入れて「部屋に入る」を押してください';render()}}
  }catch(e){}}
function needName(){const n=UI.name.trim().slice(0,10);if(!n){UI.msg='先に名前を入れてください';render();return null}UI.name=n;ls.set('goka.name',n);return n}
async function createTable(){
  const name=needName();if(!name||!NET.db)return;
  const al='abcdefghjkmnpqrstuvwxyz23456789';let id='';for(let i=0;i<5;i++)id+=al[Math.floor(Math.random()*al.length)];
  const t={id,status:'wait',seats:[{uid:NET.pid,name}],size:UI.size,map:UI.map,target:UI.target,created:Date.now(),updated:Date.now()};
  try{await NET.db.doc('tables/'+id).set(t);await enter(id)}catch(e){UI.msg='部屋を作れませんでした（'+(e&&e.code||'error')+'）。このページの共有設定を確認してください';render()}}
async function join(code){
  const name=needName();if(!name||!NET.db)return;code=String(code||'').trim().toLowerCase();
  if(!/^[a-z0-9]{5}$/.test(code)){UI.msg='部屋の合言葉は5文字です';render();return}
  const s=await NET.db.doc('tables/'+code).get().catch(()=>null);
  if(!s||!s.exists){UI.msg='その部屋は見つかりませんでした';render();return}
  const t=s.data();
  if(t.seats.some(x=>x.uid===NET.pid))return enter(code);
  if(t.status!=='wait'||t.seats.length>=t.size){UI.msg='その部屋はもう始まっているか満席です';render();return}
  await enter(code);
  let n=0;clearInterval(NET.wait);
  const ask=()=>{const seated=NET.t&&NET.t.seats.some(x=>x.uid===NET.pid);
    if(seated||n++>7||NET.tid!==code){clearInterval(NET.wait);if(!seated&&NET.tid===code){UI.msg='席に着けませんでした。部屋を作った人がページを開いているか確認してください';leave()}return}
    NET.gr&&NET.gr.emit('act',{sit:name,pid:NET.pid}).catch(()=>{})};
  NET.wait=setInterval(ask,1500);setTimeout(ask,400)}
async function enter(code){
  NET.tid=code;ls.set('goka.table',code);UI.screen='lobby';UI.msg='';render();
  try{NET.gr=await NET.room.join('t'+code)}catch(e){UI.msg='部屋につなげませんでした';leave();return}
  NET.gr.onPeers(ch=>{NET.peers=ch.peers||[];const now=Date.now();NET.peers.forEach(p=>{if(p.presence&&p.presence.uid)NET.seen[p.presence.uid]=now});soft()},()=>{});
  NET.gr.on('act',onAct,()=>{});
  NET.gr.presence({uid:NET.pid}).catch(()=>{});
  NET.unsub=NET.db.doc('tables/'+code).onSnapshot(onSnap,()=>{})}
function onSnap(s){
  if(!s.exists){if(NET.tid){UI.msg='部屋がなくなりました';leave()}return}
  const t=s.data();if(!t||t.id!==NET.tid)return;
  if(NET.t&&(t.rev||0)<(NET.t.rev||0))return;
  NET.t=t;
  if(t.G&&(!G||t.G.seq>=G.seq)){G=t.G;if(UI.screen==='lobby')UI.screen='game'}
  render()}
const present=()=>new Set(NET.peers.map(p=>p.presence&&p.presence.uid).filter(Boolean));
function amHost(){if(SRV&&!NET.local)return false;if(NET.local)return true;if(!NET.t)return false;const pr=present();pr.add(NET.pid);const h=NET.t.seats.find(s=>pr.has(s.uid));return!!h&&h.uid===NET.pid}
function isAway(p){if(!p.uid||NET.local)return false;if(p.uid===NET.pid)return false;if(present().has(p.uid))return false;return Date.now()-(NET.seen[p.uid]||NET.since||0)>IDLE_MS}

  try{do{NET.pendingW=false;NET.t.rev=(NET.t.rev||0)+1;NET.t.updated=Date.now();
    if(G){NET.t.G=JSON.parse(JSON.stringify(G));NET.t.status=G.phase==='over'?'done':'play'}
    await NET.db.doc('tables/'+NET.t.id).set(NET.t)}while(NET.pendingW)}

    if(typeof d.pid!=='string'||NET.t.seats.some(s=>s.uid===d.pid)||NET.t.seats.length>=NET.t.size)return;
    NET.t.seats.push({uid:d.pid,name:String(d.sit).slice(0,10)});save();render();return}
  if(!G||!Number.isInteger(d.seat)||!G.pl[d.seat]||G.pl[d.seat].uid!==d.pid||!d.a)return;
  noteActive(d.pid);if(d.a.t==='ping')return;

  const aid=NET.pid.slice(-6)+'-'+(++NET.aid)+'-'+Date.now(),seq=G.seq,msg={seat:s,a,aid,pid:NET.pid};
  let n=0;const send=()=>{if(!G||G.seq!==seq||n++>3)return;NET.gr&&NET.gr.emit('act',msg).catch(()=>{});setTimeout(send,1800)};send();

function pingIdle(){const s=seatOf();if(s===null||NET.local||UI.screen!=='game'||G.phase==='over')return;const now=Date.now();UI.idle0=now;
  if(!G.pl[s].afk&&now-NET.pinged<3000)return;NET.pinged=now;
  if(amHost())noteActive(NET.pid);else NET.gr&&NET.gr.emit('act',{seat:s,a:{t:'ping'},pid:NET.pid}).catch(()=>{})}
function idleCheck(){if(NET.local)return;const now=Date.now();NET.mark=NET.mark||now;let ch=false;
  waitSeats(G).forEach(i=>{const p=G.pl[i];if(p.uid&&!p.cpu&&!p.afk&&!isAway(p)&&now-Math.max(NET.mark,NET.act[p.uid]||0)>IDLE_MS){p.afk=true;log(G,`${p.name}は操作が止まり離席になった`);ch=true}});
  if(ch){save();render()}}
function tick(){
  if(!G||G.phase==='over'||UI.screen!=='game'||!amHost()||Date.now()<NET.nextCpu)return;
  idleCheck();const auto=i=>G.pl[i].cpu||G.pl[i].afk||isAway(G.pl[i]);
  let s=null;
  if(G.offer){const w=G.pl.map((_,i)=>i).filter(i=>i!==G.offer.from&&!G.offer.no.includes(i));s=w.find(auto);if(s===undefined){s=auto(G.offer.from)?G.offer.from:null}}
  else if(auto(G.cur))s=G.cur;
  if(s===null||s===undefined)return;
  const a=cpuAct(G,s),e=apply(G,s,a);
  if(e&&s===G.cur&&!G.offer)apply(G,s,G.phase==='roll'?{t:'roll'}:{t:'end'});
  NET.mark=Date.now();NET.nextCpu=Date.now()+(a.t==='respond'?300:a.t==='earn'||a.t==='post'?100:a.t==='roll'||a.k==='forecast'?1500:750);save();render()}

function knotRim(st,K){let h='';const S=(p)=>`<polyline points="${p}" fill="none" stroke="${K}" stroke-width="8.5" stroke-linejoin="round"/><polyline points="${p}" fill="none" stroke="var(--brass)" stroke-width="4.6" stroke-linejoin="round"/>`;
  st.forEach((a,i)=>{const b=st[(i+1)%st.length],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),n=Math.max(2,Math.round(L/44)),ux=-dy/L,uy=dx/L;
    const w=(sg,u0,u1)=>{const p=[];for(let j=0;j<=24;j++){const u=u0+(u1-u0)*j/24,o=sg*7*Math.sin(2*Math.PI*n*u);p.push((a[0]+dx*u+ux*o).toFixed(1)+','+(a[1]+dy*u+uy*o).toFixed(1))}return p.join(' ')};
    const full=sg=>{const p=[];for(let c=0;c<n;c++)p.push(w(sg,c/n,(c+1)/n));return p.join(' ')};
    h+=S(full(-1))+S(full(1));for(let c=0;c<=n;c++){const m=c/n,d=.17/n;h+=S(w(-1,Math.max(0,m-d),Math.min(1,m+d)))}});return h}

  const eP=e=>{const[a,b]=B.edges[e];return`M${xy(a).map(v=>v.toFixed(1))}L${xy(b).map(v=>v.toFixed(1))}`};
  const rolled=g.dA!==null&&!(UI.roll>Date.now()),hit=i=>rolled&&!blocked(g,i)&&(g.faces[i]===RES[g.dB-1]||g.faces[i]===RES[g.dD-1]||g.faces[i]===RES[g.dE-1])&&(g.nums[i]===g.dA||g.nums[i]===g.dC);let h='',hl='';
  B.faces.forEach((f,i)=>{const t=g.faces[i],ink=t==='coal'||t==='waste'||t==='copper'?'#f3eee2':K,x=f.cx.toFixed(1),y=f.cy;
    h+=`<path d="${cellP(i)}" fill="${ART[t]?`url(#t-${t})`:`var(--${t})`}" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/>`;if(rolled&&!hit(i))h+=`<path d="${cellP(i)}" fill="${K}" fill-opacity=".58"/>`;if(rolled&&hit(i))hl+=`<path class="hitc" d="${cellP(i)}" fill="#ffe08a" fill-opacity=".16" stroke="#ffd34d" stroke-width="7" stroke-linejoin="round"/><path d="${cellP(i)}" fill="none" stroke="#fff8dc" stroke-width="2" stroke-linejoin="round"/>`;
    const T=(yy,sz,tx)=>`<text x="${x}" y="${yy.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${sz.toFixed(1)}" font-family="var(--disp)" font-weight="800" fill="${ART[t]?'#2b2118':ink}">${tx}</text>`;
    const r=Math.min(25,f.inr*.8);if(ART[t])h+=`<circle cx="${x}" cy="${y}" r="${r.toFixed(1)}" fill="${rolled&&hit(i)?'#ffd75e':'var(--paper)'}" fill-opacity="${rolled&&hit(i)?1:.92}" stroke="#2b2118" stroke-width="${rolled&&hit(i)?3:1.5}"/>`;
    if(t==='waste'){h+=T(y,r*1.1,RG[t]);return}
    if(r>=20)h+=T(y-r*.38,r*.72,RG[t])+T(y+r*.42,r*.92,g.nums[i]);else h+=T(y,r*.82,RG[t]+g.nums[i])});
  B.faces.forEach((f,i)=>{if(hit(i))h+=`<path d="${cellP(i)}" fill="none" stroke="var(--brass)" stroke-width="8" stroke-linejoin="round"/>`});
  h+=knotRim(B.star,K);

  B.nodes.forEach((p,n)=>{if(p.way)h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--paper)" stroke="${K}" stroke-width="2"/>`;else if(!B.dead[n]&&!g.nodes[n])h+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="${K}" fill-opacity=".55"/>`});
  g.edges.forEach((o,e)=>{if(o===null)return;h+=g.ek[e]?`<path d="${eP(e)}" stroke="${K}" stroke-width="14" stroke-linecap="round"/><path d="${eP(e)}" stroke="${PC[o]}" stroke-width="9" stroke-linecap="round"/>`

    h+=b.k==='h'?`<path transform="${at} scale(.58)" d="M-20 20V-4L0 -24L20 -4V20Z" fill="${PC[b.o]}" stroke="${K}" stroke-width="6"/>`

  if(['hut','setupHut','seize','raid','st','fac'].includes(mode)){const ns={hut:legalHuts,setupHut:setupHuts,seize:legalSeize,raid:legalRaid,st:legalSt,fac:legalFac}[mode](g,my);
    ns.forEach(n=>{const[x,y]=xy(n).map(v=>v.toFixed(1));h+=`<circle class="pulse" cx="${x}" cy="${y}" r="13" fill="var(--paper)" stroke="${K}" stroke-width="3"/><circle data-n="${n}" cx="${x}" cy="${y}" r="30" fill="transparent" style="cursor:pointer"/>`})}
  if(['dirt','rail','setupLine','upg','take'].includes(mode)){(mode==='upg'?legalUpg:mode==='take'?legalTake:legalLines)(g,my).forEach(e=>{h+=`<path class="pulse" d="${eP(e)}" stroke="var(--paper)" stroke-width="8" stroke-dasharray="11 9"/><path data-e="${e}" d="${eP(e)}" stroke="transparent" stroke-width="30" style="cursor:pointer"/>`})}

  let mode=null;if(mine&&!g.offer){if(g.phase==='setup')mode=g.step==='hut'?'setupHut':'setupLine';else if(g.phase==='block')mode='block';else if(g.phase==='main')mode=g.bridge>0?'rail':UI.mode}
  let h=`<div class="game"><div class="boardwrap">${boardSvg(g,{seat:me,mode})}</div><div class="side">`;
  if(p&&p.afk)h+=`<div class="prompt" style="--who:var(--warn)"><b>離席中です</b><p class="sub">CPUが代わりに打っています。画面をタップすると戻ります</p></div>`;
  h+=`<div class="prompt" style="--who:${PC[g.cur]}"><b>${esc(t1)}</b>${t2?`<p class="sub">${esc(t2)}</p>`:''}${!NET.local&&p&&!p.afk&&waitSeats(g).includes(me)?`<p class="err" id="idle">${idleTxt()}</p>`:''}${UI.toast?`<p class="err">${esc(UI.toast)}</p>`:''}</div>`;
  if(g.offer&&me!==null&&me!==g.offer.from&&!g.offer.no.includes(me)){const can=canPay(p,g.offer.want);
    h+=`<div class="offer"><b>${esc(g.pl[g.offer.from].name)}からの提案</b><p>もらう：${esc(bagTxt(g.offer.give))}<br>渡す：${esc(bagTxt(g.offer.want))}</p><div class="row"><button class="btn main grow" data-a="yes" ${can?'':'disabled'}>${can?'取引する':'足りません'}</button><button class="btn grow" data-a="no">断る</button></div></div>`}
  if(g.dA!==null){const sp=UI.roll>Date.now();h+=`<div class="dice ${sp?'rolling':''}">${diceFaces(g,sp).map(v=>`<b>${v}</b>`).join('')}${!sp&&g.dA===g.dC?'<span class="sub">ゾロ目</span>':''}</div>`}
  if(p)h+=`<div class="purse"><span class="sub">所持金</span><b>${p.hand.money}</b></div><div class="hand">${RES.map(r=>`<div class="res r-${r}${artC(r)}"><b>${p.hand[r]}</b><span>${RN[r]}</span></div>`).join('')}</div>`;
  if(mine&&g.phase==='roll')h+=`<button class="btn main" data-a="roll">サイコロを振る</button>`;
  if(mine&&g.offer)h+=`<button class="btn" data-a="cancel">提案を取り下げる</button>`;
  if(mine&&g.phase==='main'&&!g.offer){
    const b=(k,l,c,en)=>`<button class="btn ${UI.mode===k?'on':''}" data-a="mode" data-m="${k}" ${en&&g.ap>0?'':'disabled'}>${l}<small>${costTxt(c)}</small></button>`,road=lines(g,me)<LIMIT.line,mOk=p.mini<=g.turn;
    h+=`<div class="acts">
      ${b('dirt','土の道',COST.dirt,canPay(p,COST.dirt)&&road&&legalLines(g,me).length)}
      ${b('rail','線路',COST.rail,canPay(p,COST.rail)&&road&&legalLines(g,me).length)}
      ${b('upg','線路へ強化',COST.upg,canPay(p,COST.upg)&&legalUpg(g,me).length)}
      ${b('take','道を乗っ取る',COST.take,canPay(p,COST.take)&&road&&legalTake(g,me).length)}
      ${b('hut','小屋 1点',COST.hut,canPay(p,COST.hut)&&count(g,me,'h')<LIMIT.hut&&legalHuts(g,me).length)}
      ${b('seize','小屋を奪う',COST.seize,canPay(p,COST.seize)&&count(g,me,'h')<LIMIT.hut&&legalSeize(g,me).length)}
      ${b('st','駅 2点',COST.st,canPay(p,COST.st)&&count(g,me,'s')<LIMIT.st&&legalSt(g,me).length)}
      ${b('fac','工場 3点',COST.fac,canPay(p,COST.fac)&&count(g,me,'o')<LIMIT.fac&&legalFac(g,me).length)}
      <button class="btn" data-a="deed" ${canPay(p,COST.deed)&&p.deeds<LIMIT.deed?'':'disabled'}>権利書 1点<small>${costTxt(COST.deed)}・残り${LIMIT.deed-p.deeds}枚</small></button>
      <button class="btn" data-a="buy" ${canPay(p,COST.card)&&g.deck.length?'':'disabled'}>契約書<small>${costTxt(COST.card)}</small></button>
      <button class="btn" data-a="mini" ${mOk?'':'disabled'}>ミニゲーム<small>${mOk?'最大9稼げる':`あと${p.mini-g.turn}周`}</small></button>
      <button class="btn ${UI.panel==='town'?'on':''}" data-a="panel" data-p="town">町商人</button>
      <button class="btn ${UI.panel==='market'?'on':''}" data-a="panel" data-p="market">市場で売買</button>
      <button class="btn ${UI.panel==='trade'?'on':''}" data-a="panel" data-p="trade">相手と取引</button>
      <button class="btn main wide" data-a="end">手番を終える</button></div>`}
  if(mine&&g.phase==='main'&&UI.panel==='town'&&!g.offer){
    h+=`<div class="box"><h3>町商人</h3><p class="sub">どちらも行動を1回使います。増産権は1人${LIMIT.boost}枚までで、1枚目は金16、2枚目は金24です。道が届いていない町も、出張料お金${TRIP}で1手番に1回だけ使えます。</p>${g.shop.map((s,k)=>{const on=visit(g,me,k),fee=on?0:TRIP,ok=on||!g.trip,ic=itemCost(p)+fee;
      return`<div class="town"><b>町${k+1}${on?'':`（未到達・出張料${TRIP}）`}</b><div class="cardrow">${s.map(r=>`<button class="btn" data-a="item" data-k="${k}" data-r="${r}" ${ok&&g.ap>0&&p.hand.money>=ic&&p.boost.length<LIMIT.boost&&!p.boost.includes(r)?'':'disabled'}>${RN[r]}の増産権<small>金${ic}・生産2倍</small></button>`).join('')||'<span class="sub">増産権は売り切れです</span>'}<button class="btn" data-a="deliver" data-k="${k}" ${ok&&g.ap>0&&p.ord<LIMIT.ord&&canPay(p,g.orders[k])&&p.hand.money>=fee?'':'disabled'}>納品${costTxt(g.orders[k])}<small>+1点・金${ORDER_PAY}${fee?`（出張料${fee}）`:''}</small></button></div></div>`}).join('')}</div>`}
  if(mine&&g.phase==='main'&&UI.panel==='market'&&!g.offer){
    h+=`<div class="box"><h3>市場</h3>${RES.map(r=>`<div class="mk"><span>${RN[r]}</span><button class="btn" data-a="mbuy" data-r="${r}" ${p.hand.money>=g.mk[r]?'':'disabled'}>${g.mk[r]}で買う</button><button class="btn" data-a="msell" data-r="${r}" ${p.hand[r]>0?'':'disabled'}>${sellP(g,r)}で売る</button></div>`).join('')}<p class="sub">買うと値上がりし、売ると値下がりします。全員の手番が一周すると元の値段に近づきます。</p></div>`}
  if(p&&g.phase!=='setup'&&(UI.panel==='post'||(mine&&g.phase==='main'&&UI.panel==='trade'&&!g.offer))){
    const pm=(b,r)=>`<div class="pm"><button data-a="tr" data-b="${b}" data-r="${r}" data-d="-1" aria-label="${RN[r]}を減らす">−</button><span>${UI[b][r]||0}</span><button data-a="tr" data-b="${b}" data-r="${r}" data-d="1" aria-label="${RN[r]}を増やす">＋</button></div>`;
    h+=`<div class="box"><h3>相手と取引</h3><div class="step"><span></span><span class="sub">渡す</span><span class="sub">欲しい</span></div>${KEYS.map(r=>`<div class="step"><span>${RN[r]}</span>${pm('give',r)}${pm('want',r)}</div>`).join('')}${UI.panel==='trade'?`<button class="btn main" data-a="offer">全員に提案する（残り${OFFERS-g.offers}回）</button>`:''}<button class="btn" data-a="post">掲示板に出す</button></div>`}
  if(g.phase!=='setup'){const can=mine&&g.phase==='main'&&!g.offer;
    h+=`<div class="box"><h3>取引掲示板</h3><p class="sub">手番でなくても掲示できます。手番の人が受けると成立します。手番ごとの最初の取引は、両者にお金1が入ります。</p>${g.pl.map((q,i)=>q.post?`<div class="trow"><span>${esc(q.name)}：${esc(bagTxt(q.post.give))}を渡す ⇄ ${esc(bagTxt(q.post.want))}が欲しい</span>${i===me?'<button class="btn" data-a="unpost">取り下げ</button>':`<button class="btn" data-a="accept" data-s="${i}" ${can&&canPay(q,q.post.give)&&canPay(p,q.post.want)?'':'disabled'}>受ける</button>`}</div>`:'').join('')||'<p class="sub">掲示はありません</p>'}${p?`<button class="btn ${UI.panel==='post'?'on':''}" data-a="panel" data-p="post">掲示を作る</button>`:''}</div>`}
  if(p&&p.cards.length){const use=c=>mine&&!g.played&&c.t<g.tick&&c.k!=='secret'&&(g.phase==='main'||g.phase==='roll')&&!g.offer&&!(c.k==='forecast'&&g.phase!=='roll')&&!((c.k==='bond'||c.k==='raid')&&g.phase!=='main');
    h+=`<div class="box"><h3>契約書</h3><div class="cardrow">${p.cards.map(c=>`<button class="btn ${UI.card===c.k?'on':''}${ART[c.k]?' ctr'+artC(c.k):''}" data-a="card" data-k="${c.k}" ${use(c)?'':'disabled'} title="${esc(CARD[c.k].d)}">${CARD[c.k].n}<small>${c.k==='secret'?'+1点':c.t>=g.tick?'次の手番から':''}</small></button>`).join('')}</div>`;
    if(UI.card&&mine)h+=cardPanel();h+=`</div>`}
  h+=`<div class="box"><h3>商会（${g.target}点で勝ち${NET.local?`・CPU ${LV[g.lv??1]}`:''}）</h3><div class="players">${g.pl.map((q,i)=>`<div class="pl ${i===g.cur?'cur':''}"><i style="background:${PC[i]}"></i><div style="min-width:0"><div class="nm">${esc(q.name)}${i===me&&q.name!=='あなた'?'（あなた）':''}${isAway(q)||q.afk?' 離席':''}${g.king===i?' 取引王':''}${g.road===i?' 大街道':''}${g.surv===i?' 測量長':''}</div><div class="st">物資${handN(q)}　金${q.hand.money}　契約${q.cards.length}　道${lines(g,i)}/${LIMIT.line}　最長${roadLen(g,i)}${q.sv?'　測量'+q.sv:''}${q.loot?'　略奪'+q.loot:''}${q.boost.length?'　増産'+q.boost.map(r=>RG[r]).join(''):''}</div></div><span class="vp">${i===me?fullVP(g,i):pubVP(g,i)}</span></div>`).join('')}</div></div>`;
  h+=`<div class="box"><h3>記録</h3><div class="log" aria-live="polite">${g.log.slice().reverse().slice(0,30).map(m=>`<p>${esc(m)}</p>`).join('')}</div></div>`;
  h+=`<div class="row"><button class="btn" data-a="rules">遊び方</button>${NET.local?'<button class="btn" data-a="leave">やめる</button>':me!==null?'<button class="btn" data-a="quit">席を立つ（CPUに任せる）</button>':'<button class="btn" data-a="leave">観戦をやめる</button>'}</div></div></div>`;
  if(g.phase==='over'){const rank=g.pl.map((q,i)=>({q,i,v:fullVP(g,i)})).sort((a,b)=>b.v-a.v);
    h+=`<div class="over"><div><h2>${esc(g.pl[g.winner].name)}の勝ち</h2>${rank.map(x=>`<div class="pl"><i style="background:${PC[x.i]}"></i><span class="nm">${esc(x.q.name)}</span><span class="vp">${x.v}点</span></div>`).join('')}<p class="sub">隠し資産も点数に入っています</p><button class="btn main" data-a="leave">表紙へ戻る</button></div></div>`}
  return h}
function cardPanel(){const k=UI.card,opt=v=>RES.map(r=>`<option value="${r}" ${v===r?'selected':''}>${RN[r]}</option>`).join('');
  if(k==='forecast')return`<p class="sub">${CARD.forecast.d}</p><p class="sub">番号</p><div class="cardrow">${[1,2,3,4,5,6].map(d=>`<button class="btn ${UI.fd===d?'on':''}" data-a="fd" data-d="${d}">${d}</button>`).join('')}</div><p class="sub">物資</p><div class="cardrow">${RES.map(r=>`<button class="btn ${UI.fr===r?'on':''}" data-a="fr" data-r="${r}">${RN[r]}</button>`).join('')}</div><button class="btn main" data-a="forecast" ${UI.fd&&UI.fr?'':'disabled'}>この目で振る</button>`;
  if(k==='import')return`<p class="sub">${CARD.import.d}</p><div class="row"><label class="grow" for="m1">1つ目<select id="m1">${opt(UI.r1)}</select></label><label class="grow" for="m2">2つ目<select id="m2">${opt(UI.r2)}</select></label><button class="btn main" data-a="import">もらう</button></div>`;
  if(k==='raid'){const me=seatOf(),ok=count(G,me,'h')<LIMIT.hut&&legalRaid(G,me).length;return`<p class="sub">${CARD.raid.d}</p><button class="btn main" data-a="raidgo" ${ok?'':'disabled'}>${UI.mode==='raid'?'地図の光る小屋を選んでください':'奪う小屋を選ぶ'}</button>`}
  return`<p class="sub">${CARD[k].d}</p><button class="btn main" data-a="usecard">使う</button>`}
function rulesView(){return`<div class="rules"><h2>遊び方</h2>
  <p>正五角形の大陸で、先に勝利点（ふつうは20点）を集めた商会の勝ちです。</p>
  <h3>盤面</h3><ul><li>物資は8種類です。回収できない荒地は中央の1マスだけで、荒地に触れる点には建てられません</li><li>建てられる点は、どこもちょうど3マスの物資に触れています</li><li>外周も道を通せます。外周の白い点は通過するだけで、建物は置けません</li><li>5つの角に町商人がいます</li></ul>
  <h3>はじめ</h3><ul><li>手番の順番は、対局を始めるときに毎回ランダムで決まります</li><li>順番に小屋と土の道を1組ずつ置きます。2周目は逆の順番です</li><li>2つ目の小屋に触れる3マスから最初の物資をもらいます。お金は全員4から始まります</li></ul>
  <h3>手番</h3><ul><li>サイコロを5個振ります。物資のサイコロ3個（8面）と番号のサイコロ2個（6面）です</li><li>出た物資のどれかで、出た番号のどちらかのマスに触れる建物が物資を生みます。小屋は1個、駅は2個、工場は3個です</li><li>手番の人が何ももらえなかったときは、補助金としてお金を1もらいます</li><li>行動は1手番に${AP}回までです。道、建物、町商人が行動を使います。市場、取引、契約書、権利書、ミニゲームは行動を使いません</li></ul>
  <h3>ゾロ目</h3><ul><li>番号の2個が同じなら、振った本人だけがお金を${ZORO}もらいます。物資も2個以上そろえば${ZORO3}もらえます</li><li>振った人は通行止めを動かせます。止めたマスは物資が出なくなり、そばの相手から物資を1つもらえます</li><li>番号がゾロ目のとき、物資を14個以上持つ人は半分を失います</li></ul>
  <h3>建物</h3><div class="tbl"><table><tr><th>建物</th><th>費用</th><th>点</th><th>生産</th></tr>
    <tr><td>小屋</td><td>食料・塩</td><td>1点</td><td>1個</td></tr><tr><td>駅（小屋から）</td><td>石材・鉄・綿2・銅・お金2</td><td>2点</td><td>2個</td></tr><tr><td>工場（駅から）</td><td>鉄2・石炭・銅2・塩2・食料・お金4</td><td>3点</td><td>3個</td></tr></table></div>
  <ul><li>相手の小屋は、自分の道がつながっていれば費用の2倍（食料2・塩2）で奪えます。駅と工場は奪えません</li></ul>
  <h3>道</h3><div class="tbl"><table><tr><th>道</th><th>費用</th><th>特徴</th></tr>
    <tr><td>土の道</td><td>木材</td><td>安いけれど乗っ取られます</td></tr><tr><td>線路</td><td>石材・鉄</td><td>乗っ取られません</td></tr><tr><td>線路へ強化</td><td>石炭</td><td>自分の土の道を線路にします</td></tr><tr><td>乗っ取り</td><td>石材・鉄・お金2</td><td>自分の道につながる相手の土の道を奪い、線路にします</td></tr></table></div>
  <h3>特別な点</h3><ul><li><b>大街道</b> つながった自分の道が${ROAD_MIN}本以上で最長の人は${ROAD}点もらえます。相手の建物がある点で道は切れます。同じ長さなら今の持ち主のままです</li><li><b>測量長</b> 測量隊を${SURV_MIN}回以上使い、使った回数が最多の人は${SURV}点もらえます</li><li><b>略奪点</b> 相手の小屋を奪う、または土の道を乗っ取るたびに1点もらえます。1人${LOOT_MAX}点までで、一度もらえば消えません</li></ul>
  <h3>町商人</h3><ul><li>角のマスに触れる点まで道か建物が届くと、その町を使えます。届いていない町も、出張料お金${TRIP}を払えば1手番に1回だけ使えます</li><li><b>増産権</b>（1枚目お金16、2枚目お金24）その物資の生産が2倍になります。1人2枚まで、各町の在庫限りです</li><li><b>納品</b> 注文の物資を渡すと1点とお金${ORDER_PAY}をもらえます。1人3点までです</li></ul>
  <h3>取引</h3><ul><li>手番の人は1手番に${OFFERS}回まで全員に提案できます。最初に受けた人と成立します</li><li>取引掲示板には、手番でなくても1人1件掲示できます。手番の人が受けると成立します</li><li>手番ごとの最初の成立取引では、両者にお金1と取引実績1が入ります</li><li>取引実績が${KING_MIN}回以上で最多の人は<b>取引王</b>となり、${KING}点もらえます</li></ul>
  <h3>お金</h3><ul><li>お金は全員4から始まります。市場の売値は買値の半分です。買うと値上がりし、売ると値下がりします</li><li>権利書はお金12で1点、1人2枚までです。契約書は綿・食料・お金2です</li><li>ミニゲームは${MINI_GAP}周に1回だけ遊べます。荷車の積み込み、七日の相場、線路つなぎから選べて、最大9稼げます</li></ul>
  <h3>契約書</h3><div class="ctrs">${Object.keys(CARD).map(k=>`<div class="${artC(k).trim()}" style="${ART[k]?'':'background:var(--sea3)'}"><b>${CARD[k].n}（${CARD[k].c}枚）</b>${CARD[k].d}</div>`).join('')}</div>
  <div><button class="btn main" data-a="back">戻る</button></div></div>`}

/* --- ミニゲーム（#mini に出すので、対局の更新で消えない） --- */
const MINI={menu:false,key:'',rail:null,raf:0,sent:false};
const miniBox=h=>{$('mini').innerHTML=`<div class="over"><div>${h}</div></div>`};
function miniClear(){if(MINI.key){cancelAnimationFrame(MINI.raf);MINI.key='';$('mini').innerHTML=''}MINI.rail=null}
function miniDraw(){
  const s=UI.screen==='game'&&G?seatOf():null,m=s!==null&&s>=0&&G.pl[s]?G.pl[s].mg:null;
  if(!m&&!MINI.menu)return miniClear();
  if(m)MINI.menu=false;
  const key=m?JSON.stringify(m):'menu';if(key===MINI.key)return;MINI.key=key;
  if(!m)return miniBox(`<h2>ミニゲーム</h2><p class="sub">${MINI_GAP}周に1回の大仕事です。始めると途中ではやめられません。最大9稼げます。</p>
    <button class="btn main" data-a="m-cart">荷車の積み込み<small>限界の分からない荷車に、どこまで積むか</small></button>
    <button class="btn main" data-a="m-trade">七日の相場<small>当たるとは限らない噂を頼りに売り買いする</small></button>
    <button class="btn main" data-a="m-rail">線路つなぎ<small>線路を回して、時間内に町までつなぐ</small></button>
    <button class="btn" data-a="m-x">やめる</button>`);
  if(m.done){cancelAnimationFrame(MINI.raf);return miniBox(`<h2>${m.n}稼ぎました</h2><p>${esc(m.msg)}</p><button class="btn main" data-a="m-ok">受け取る</button>`)}
  if(m.g==='cart')return miniBox(`<h2>荷車の積み込み</h2><p class="sub">荷車の限界は重さ7〜12のどこかです。超えると壊れて、価値の3分の1しか残りません。</p>
    <div class="track"><div class="zone" style="left:${7/13*100}%;width:${6/13*100}%;background:var(--warn)"></div><div class="mark" style="left:${m.load/13*100}%"></div></div>
    <p>重さ <b>${m.load}</b>　価値 <b>${m.val}</b>（9まで）</p>
    <div class="row">${m.offer.map((c,i)=>`<button class="btn main grow" data-a="m-pick" data-i="${i}">${c[0]}を積む<small>重さ${c[1]}・価値${c[2]}</small></button>`).join('')}</div>
    <button class="btn" data-a="m-go" ${m.load?'':'disabled'}>ここで出発する</button>`);
  if(m.g==='trade'){const chart=`<svg viewBox="0 0 280 70" style="width:100%;height:auto;display:block" aria-hidden="true"><polyline fill="none" stroke="var(--brass)" stroke-width="3" stroke-linejoin="round" points="${m.hist.map((v,i)=>`${10+i*43},${64-v*5}`).join(' ')}"/>${m.hist.map((v,i)=>`<circle cx="${10+i*43}" cy="${64-v*5}" r="4" fill="var(--paper)"/>`).join('')}</svg>`;
    return miniBox(`<h2>七日の相場　${m.day}日目</h2>${chart}<p>値段 <b>${m.price}</b>　手元 <b>${m.cash}</b>　在庫 <b>${m.stock}</b></p>
    <p class="sub">噂：明日は${m.nx.tip>0?'上がる':'下がる'}らしい（噂は7割当たります）</p>
    <div class="row"><button class="btn main grow" data-a="m-buy" ${m.cash>=m.price?'':'disabled'}>1つ買う</button><button class="btn main grow" data-a="m-sell" ${m.stock?'':'disabled'}>1つ売る</button></div>
    <button class="btn" data-a="m-next">${m.day<7?'次の日へ':'相場を閉じる'}</button>`)}
  if(m.g==='rail'){if(!MINI.rail||MINI.rail.t0!==m.t0){MINI.rail={t0:m.t0,g:m.grid.slice(),s:m.s,e:m.e,start:performance.now()};MINI.sent=false}railDraw();cancelAnimationFrame(MINI.raf);MINI.raf=requestAnimationFrame(railLoop)}}
function railSvg(){const b=MINI.rail,S=70,mid=S/2,W=S*RN4,lit=railTrace(b.g,b.s,b.e).lit;
  const pathOf=m=>{const p={1:[mid,0],2:[S,mid],4:[mid,S],8:[0,mid]},k=[1,2,4,8].filter(x=>m&x);return`M${p[k[0]]}Q${mid},${mid} ${p[k[1]]}`};let h='';
  b.g.forEach((m,i)=>{const x=(i%RN4)*S,y=Math.floor(i/RN4)*S;h+=`<g transform="translate(${x} ${y})" data-a="m-tile" data-i="${i}" style="cursor:pointer"><rect x="2" y="2" width="${S-4}" height="${S-4}" rx="6" fill="var(--sea)" stroke="var(--line)"/><path d="${pathOf(m)}" fill="none" stroke="${lit.includes(i)?'var(--brass)':'var(--mute)'}" stroke-width="11"/></g>`});
  const a=b.s*S+mid,z=b.e*S+mid;return`<svg viewBox="-26 0 ${W+52} ${W}" style="width:100%;height:auto;display:block;touch-action:manipulation"><path d="M-22 ${a}H2" stroke="var(--brass)" stroke-width="11"/><path d="M${W-2} ${z}H${W+22}" stroke="var(--wood)" stroke-width="11"/>${h}</svg>`}
function railDraw(){miniBox(`<h2>線路つなぎ</h2><p class="sub">マスを押すと線路が回ります。左の金色から右の緑までつなげてください。15秒以内で9、25秒以内で6、40秒以内で3です。</p><div class="track" style="height:14px"><div class="zone" id="rl" style="left:0;width:100%"></div></div>${railSvg()}`)}
function railLoop(t){const b=MINI.rail,el=$('rl');if(!b||!el)return;const s=(t-b.start)/1000;if(s>=40){if(!MINI.sent){MINI.sent=true;act({t:'mg',op:'fail'})}return}el.style.width=(100-s/40*100)+'%';MINI.raf=requestAnimationFrame(railLoop)}
function railTap(i){const b=MINI.rail;if(!b||MINI.sent)return;b.g[i]=railRot(b.g[i]);railDraw();if(railTrace(b.g,b.s,b.e).ok){MINI.sent=true;act({t:'mg',op:'solve',grid:b.g})}}

  if(t.id==='sz')UI.size=+v;if(t.id==='tg')UI.target=+v;if(t.id==='mp'){UI.map=+v;render()}if(t.id==='m1')UI.r1=v;if(t.id==='m2')UI.r2=v});
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-n],[data-e],[data-f]');
  if(s&&G&&s.dataset.a===undefined){const d=s.dataset;UI.toast='';
    if(d.n!==undefined){const n=+d.n;const rd=UI.mode==='raid';if(rd)UI.card=null;act(G.phase==='setup'?{t:'setupHut',n}:rd?{t:'play',k:'raid',n}:{t:UI.mode,n});UI.mode=null}
    else if(d.e!==undefined){const x=+d.e;const m=G.bridge>0?'rail':UI.mode;act(G.phase==='setup'?{t:'setupLine',e:x}:m==='upg'||m==='take'?{t:m,e:x}:{t:'line',k:m,e:x});if(!G.bridge)UI.mode=null}

    soft();return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;UI.toast='';
  const go={create:createTable,local:startLocal,join:()=>join(UI.code),joinid:()=>join(d.id),start:startOnline,leave,
    rules(){UI.prev=UI.screen;UI.screen='rules';render();scrollTo(0,0)},back(){UI.screen=UI.prev||'title';render()},
    copy(){const v=d.v;navigator.clipboard?.writeText(v).then(()=>{b.textContent='コピーしました'}).catch(()=>{b.textContent=v})},
    roll(){act({t:'roll'})},end(){UI.mode=null;UI.panel=null;UI.card=null;act({t:'end'})},buy(){act({t:'buy'})},deed(){act({t:'deed'})},cancel(){act({t:'cancel'})},
    yes(){act({t:'respond',ok:true})},no(){act({t:'respond',ok:false})},
    mode(){UI.mode=UI.mode===d.m?null:d.m;render();if(UI.mode)toBoard()},panel(){UI.panel=UI.panel===d.p?null:d.p;render()},
    item(){act({t:'item',k:+d.k,r:d.r})},deliver(){act({t:'deliver',k:+d.k})},mbuy(){act({t:'mbuy',r:d.r})},msell(){act({t:'msell',r:d.r})},
    tr(){const o=UI[d.b];o[d.r]=Math.max(0,Math.min(d.r==='money'?50:9,(o[d.r]||0)+ +d.d));render()},
    lv(){UI.lv=+d.v;ls.set('goka.lv',UI.lv);render()},accept(){act({t:'accept',s:+d.s})},unpost(){act({t:'unpost'})},post(){act({t:'post',give:UI.give,want:UI.want});UI.give={};UI.want={};UI.panel=null;soft()},
    offer(){act({t:'offer',give:UI.give,want:UI.want});UI.give={};UI.want={};UI.panel=null;soft()},
    card(){UI.card=UI.card===d.k?null:d.k;render()},
    raidgo(){UI.mode='raid';render();toBoard()},
    usecard(){const k=UI.card;UI.card=null;act({t:'play',k});toBoard()},
    fd(){UI.fd=+d.d;render()},fr(){UI.fr=d.r;render()},
    forecast(){const c={t:'play',k:'forecast',d:UI.fd,r:UI.fr};UI.card=null;UI.fd=UI.fr=null;act(c)},
    import(){UI.card=null;act({t:'play',k:'import',r:[UI.r1,UI.r2]})},
    mini(){MINI.menu=true;render()},'m-x'(){MINI.menu=false;render()},'m-cart'(){act({t:'mg',op:'start',g:'cart'})},'m-trade'(){act({t:'mg',op:'start',g:'trade'})},'m-rail'(){act({t:'mg',op:'start',g:'rail'})},'m-pick'(){act({t:'mg',op:'pick',i:+d.i})},'m-go'(){act({t:'mg',op:'go'})},'m-buy'(){act({t:'mg',op:'buy'})},'m-sell'(){act({t:'mg',op:'sell'})},'m-next'(){act({t:'mg',op:'next'})},'m-tile'(){railTap(+d.i)},'m-ok'(){act({t:'mg',op:'close'})},
    quit(){act({t:'resign'});setTimeout(leave,700)}};
  if(go[a])go[a]();if(!a.startsWith('m-')&&a!=='mini')soft()});
const DEMO={};
function demoFor(m){if(DEMO[m])return DEMO[m];
  const g=newGame({seats:[{name:'a'},{name:'b'},{name:'c'}],map:m});g.phase='demo';
  for(let i=0;i<6;i++){const c=setupHuts(g),n=c[Math.floor((i*.17+.08)*c.length)];g.nodes[n]={o:i%3,k:i===4?'o':'h'};const B=getB();g.edges[B.NE[n][0]]=i%3}
